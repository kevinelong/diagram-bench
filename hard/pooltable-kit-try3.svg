<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="black" stroke-width="2">
  <rect x="0" y="0" width="1024" height="1024" fill="white"/>
  
  <!-- Pool table -->
  <rect x="64" y="64" width="896" height="448" fill="none" stroke="black" stroke-width="4"/>
  
  <!-- Pockets -->
  <circle cx="64" cy="64" r="16"/>
  <circle cx="960" cy="64" r="16"/>
  <circle cx="64" cy="512" r="16"/>
  <circle cx="960" cy="512" r="16"/>
  <circle cx="64" cy="960" r="16"/>
  <circle cx="960" cy="960" r="16"/>
  
  <!-- Object balls in triangle rack -->
  <!-- Row 1 (1 ball) -->
  <circle cx="832" cy="256" r="16"/>
  
  <!-- Row 2 (2 balls) -->
  <circle cx="816" cy="240" r="16"/>
  <circle cx="848" cy="240" r="16"/>
  
  <!-- Row 3 (3 balls) -->
  <circle cx="800" cy="224" r="16"/>
  <circle cx="832" cy="224" r="16"/>
  <circle cx="864" cy="224" r="16"/>
  
  <!-- Row 4 (4 balls) -->
  <circle cx="784" cy="208" r="16"/>
  <circle cx="816" cy="208" r="16"/>
  <circle cx="848" cy="208" r="16"/>
  <circle cx="880" cy="208" r="16"/>
  
  <!-- Row 5 (5 balls) -->
  <circle cx="768" cy="192" r="16"/>
  <circle cx="800" cy="192" r="16"/>
  <circle cx="832" cy="192" r="16"/>
  <circle cx="864" cy="192" r="16"/>
  <circle cx="896" cy="192" r="16"/>
  
  <!-- Cue ball -->
  <circle cx="704" cy="256" r="16"/>
  <text x="720" y="250" font-family="Arial" font-size="28">CUE</text>
  
  <!-- Cue stick -->
  <rect x="640" y="256" width="128" height="8" fill="none" stroke="black" stroke-width="2"/>
</svg>