<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1024" height="1024" fill="white"/>
  
  <!-- Pool table -->
  <rect x="100" y="100" width="824" height="412" fill="none" stroke="black" stroke-width="4"/>
  
  <!-- Pockets -->
  <circle cx="100" cy="100" r="16" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="924" cy="100" r="16" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="100" cy="512" r="16" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="924" cy="512" r="16" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="100" cy="412" r="16" fill="white" stroke="black" stroke-width="2"/>
  <circle cx="924" cy="412" r="16" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Object balls in triangle rack -->
  <!-- Row 1 -->
  <circle cx="750" cy="300" r="12" fill="black" stroke="black" stroke-width="1"/>
  
  <!-- Row 2 -->
  <circle cx="730" cy="280" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="770" cy="280" r="12" fill="black" stroke="black" stroke-width="1"/>
  
  <!-- Row 3 -->
  <circle cx="710" cy="260" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="750" cy="260" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="790" cy="260" r="12" fill="black" stroke="black" stroke-width="1"/>
  
  <!-- Row 4 -->
  <circle cx="690" cy="240" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="730" cy="240" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="770" cy="240" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="810" cy="240" r="12" fill="black" stroke="black" stroke-width="1"/>
  
  <!-- Row 5 -->
  <circle cx="670" cy="220" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="710" cy="220" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="750" cy="220" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="790" cy="220" r="12" fill="black" stroke="black" stroke-width="1"/>
  <circle cx="830" cy="220" r="12" fill="black" stroke="black" stroke-width="1"/>
  
  <!-- Cue ball -->
  <circle cx="600" cy="300" r="12" fill="white" stroke="black" stroke-width="1"/>
  <text x="590" y="290" font-family="Arial" font-size="14" fill="black">CUE</text>
  
  <!-- Cue stick -->
  <rect x="500" y="290" width="100" height="8" fill="black"/>
</svg>