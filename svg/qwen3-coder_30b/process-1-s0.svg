<svg viewBox="0 0 1024 1024" width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1024" height="1024" fill="white"/>
  <rect x="0" y="0" width="1024" height="60" fill="white"/>
  <rect x="0" y="60" width="1024" height="40" fill="white"/>
  <rect x="0" y="100" width="1024" height="300" fill="white"/>
  <rect x="0" y="400" width="1024" height="40" fill="white"/>
  <rect x="0" y="440" width="1024" height="300" fill="white"/>
  <rect x="0" y="740" width="1024" height="60" fill="white"/>
  <text x="20" y="40" font-family="Arial" font-size="28" fill="black">REQUESTER</text>
  <text x="20" y="780" font-family="Arial" font-size="28" fill="black">APPROVER</text>
  <rect x="150" y="120" width="200" height="100" rx="20" ry="20" fill="white" stroke="black"/>
  <text x="170" y="170" font-family="Arial" font-size="28" fill="black">Submit Request</text>
  <rect x="450" y="120" width="200" height="100" rx="20" ry="20" fill="white" stroke="black"/>
  <text x="470" y="170" font-family="Arial" font-size="28" fill="black">Review Request</text>
  <rect x="750" y="120" width="200" height="100" rx="20" ry="20" fill="white" stroke="black"/>
  <text x="770" y="170" font-family="Arial" font-size="28" fill="black">Approve/Reject</text>
  <line x1="250" y1="220" x2="450" y2="220" stroke="black" stroke-width="2"/>
  <line x1="550" y1="220" x2="750" y2="220" stroke="black" stroke-width="2"/>
  <line x1="850" y1="220" x2="850" y2="440" stroke="black" stroke-width="2"/>
  <line x1="850" y1="440" x2="850" y2="440" stroke="black" stroke-width="2"/>
  <rect x="150" y="460" width="200" height="100" rx="20" ry="20" fill="white" stroke="black"/>
  <text x="170" y="510" font-family="Arial" font-size="28" fill="black">Send to Approver</text>
  <rect x="450" y="460" width="200" height="100" rx="20" ry="20" fill="white" stroke="black"/>
  <text x="470" y="510" font-family="Arial" font-size="28" fill="black">Process Request</text>
  <rect x="750" y="460" width="200" height="100" rx="20" ry="20" fill="white" stroke="black"/>
  <text x="770" y="510" font-family="Arial" font-size="28" fill="black">Final Decision</text>
  <line x1="250" y1="560" x2="450" y2="560" stroke="black" stroke-width="2"/>
  <line x1="550" y1="560" x2="750" y2="560" stroke="black" stroke-width="2"/>
  <line x1="850" y1="560" x2="850" y2="740" stroke="black" stroke-width="2"/>
  <line x1="850" y1="740" x2="850" y2="740" stroke="black" stroke-width="2"/>
</svg>